name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ai-research-agent

jobs:
  # ============================================
  # JOB 1: Code Quality
  # ============================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install quality tools
        run: pip install ruff

      - name: Lint with Ruff
        run: ruff check app/

      - name: Format check with Ruff
        run: ruff format --check app/

  # ============================================
  # JOB 2: Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Bandit
        run: pip install bandit

      - name: Run security scan
        run: bandit -r app/ -ll

  # ============================================
  # JOB 3: Docker Build
  # ============================================
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [quality, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_NAME }}:latest

  # ============================================
  # JOB 4: Deploy to AWS EC2
  # ============================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        # Add this env block right here:
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_ENDPOINT: ${{ secrets.LANGCHAIN_ENDPOINT }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_API_KEY,DATABASE_URL,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,LANGCHAIN_TRACING_V2,LANGCHAIN_ENDPOINT,LANGCHAIN_API_KEY,LANGCHAIN_PROJECT,TAVILY_API_KEY
          script: |
            cd ~/ai-research-agent
            git pull origin main
            printf "GEMINI_API_KEY=%s\nDATABASE_URL=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\nLANGCHAIN_TRACING_V2=%s\nLANGCHAIN_ENDPOINT=%s\nLANGCHAIN_API_KEY=%s\nLANGCHAIN_PROJECT=%s\nTAVILY_API_KEY=%s\n" \
              "$GEMINI_API_KEY" "$DATABASE_URL" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" \
              "$LANGCHAIN_TRACING_V2" "$LANGCHAIN_ENDPOINT" "$LANGCHAIN_API_KEY" "$LANGCHAIN_PROJECT" "$TAVILY_API_KEY" > .env
            docker-compose down
            docker-compose up -d --build
            docker-compose ps